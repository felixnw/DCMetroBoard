
<!DOCTYPE html>
<html lang="en">
<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<title>DCMetroBoard</title>
	
	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="arrivals" id="arrivals">
        <div class="header card">
            <div class="metro-logo"></div>
            <div class="destination">Destination</div>
            <div class="car">Car</div>
            <div class="arrival-time">Arrival</div>
        </div>
        <div class="arrival-cards"></div>
        <div class="warning-cards"></div>
    </div>

    <dialog id="settings">
        <h2>Settings</h2>
        <p>A <a href="https://developer.wmata.com/">WMATA API key</a> is required for this application to receive live train data.</p>
        <form>
            <label for="api-key">API Key:</label>
            <input type="text" id="api-key" name="api-key" autocomplete="off" placeholder="Enter your WMATA API key">
            <button type="button" id="save-api">Save API Key</button>   
        </form>
        <h3>Stations</h3>
        <p>Select one or more stations to view upcoming trains for. </br>Note that some stations have two options, depending on lines.</p>
        <label for="search">Station Search:</label>
        <input type="text" id="search" name="search" placeholder="Search by Station Name">
        <div id="selected-stations"></div>
        <div id="station-list"></div>
        <button id="clear-storage">Clear Stored Data</button>
        <button id="close-settings">Close</button>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
